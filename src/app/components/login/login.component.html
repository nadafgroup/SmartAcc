<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <div class="login-icon">🔐</div>
      <h1>Welcome Back</h1>
      <p class="login-subtitle">Sign in to continue to your dashboard</p>
    </div>
    
    <form>
      <div class="form-group">
        <input 
          type="text" 
          class="form-control"
          [(ngModel)]="username" 
          name="username"
          placeholder="Username"
          required>
      </div>

      <div class="form-group">
        <input 
          type="password" 
          class="form-control"
          [(ngModel)]="password" 
          name="password"
          placeholder="Password"
          required>
      </div>

      <button class="btn-login" [disabled]="loading" (click)="onSubmit()">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div class="demo-credentials">
        <p>📋 Demo credentials: <strong>admin</strong> / <strong>admin123</strong></p>
      </div>
    </form>

    <div class="login-footer">
      <p>© 2025 AccSmart</p>
    </div>
  </div>
</div>
