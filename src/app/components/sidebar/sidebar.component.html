<div class="sidebar" [class.open]="isOpen">
  <!-- Overlay for mobile -->
  <div class="sidebar-overlay" [class.visible]="isOpen" (click)="closeSidebar()"></div>

  <!-- Firm Info -->
  <div class="sidebar-header">
    <div class="firm-info" (click)="toggleFirmInfo()">
      <div class="firm-logo">
        <span>{{ firmPlace.charAt(0) }}</span>
      </div>
      <div class="firm-details">
        <span class="firm-place">{{ firmPlace }}</span>
        <span class="firm-name">{{ firmName }}</span>
      </div>
    </div>
  </div>

  <!-- Menu Title -->
  <div class="menu-header">
    <span>{{ menuTitle }}</span>
    <span class="menu-path">/ {{ menuTitle }}</span>
  </div>

  <!-- Sidebar Menu with Groups -->
  <div class="sidebar-menu">
    <div *ngFor="let group of sidebarGroups" class="menu-group">
      <div class="group-title">{{ group.title }}</div>
      <ul class="nav-list">
        <li *ngFor="let item of group.items" class="nav-item">
          <a class="nav-link" 
             [routerLink]="item.route" 
             routerLinkActive="active"
             (click)="closeSidebar()">
            <i [class]="'bi ' + item.icon"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Footer -->
  <div class="sidebar-footer">
    <p>© 2026 Smart Accounting</p>
    <p>Powered by Dynamic Super Software</p>
  </div>
</div>
