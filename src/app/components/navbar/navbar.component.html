<nav class="navbar">
  <div class="navbar-left">
    <button class="btn-menu-toggle" (click)="onToggleSidebar()" aria-label="Toggle sidebar">
      <i class="bi bi-list"></i>
    </button>
    <div class="logo">
      <i class="bi bi-calculator-fill"></i>
      <span class="logo-text">Smart Account</span>
    </div>
    <div class="navbar-search">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search here..." />
    </div>
  </div>

  <div class="navbar-right">
    <div class="navbar-menu">
      <ul>
        <li *ngFor="let item of navItems" class="nav-item">
          <a (click)="selectMenu(item.id)" [class.active]="activeMenu === item.id">
            <i [class]="'bi ' + item.icon"></i>
            {{ item.label }}
          </a>
        </li>
      </ul>
    </div>
    
    <div class="navbar-actions">
      <button class="btn-logout" (click)="logout()" title="Logout">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </div>
</nav>
